</style></head><body><header class="top"><div class="score"><span>🔵 СИНИЙ <b id="score-blue">0</b></span><span id="turn-label">Твой ход</span><span>🔴 <b id="score-red">0</b> КРАСНЫЙ</span></div><div class="bar" id="score-bar"></div><div class="meta"><span id="moves-count">Ходов: 0</span><span>Цель: 14 шариков</span></div></header><aside class="rules"><b>ПРЫЖОК</b><br>Свой шар → через любой → на следующий. Оба станут твоими.<br><br><b>БОНУСЫ</b><br>Линия из 3 → +1 прыжок<br>Грань 9/9 → перекрась любого<br>6 соседей → авто-захват<br><br><b>ПОБЕДА</b><br>14+ шариков или вся грань</aside><canvas id="scene" aria-label="Игровой куб 3 на 3 на 3"></canvas><div class="status" id="uma-status">УМА · Твой ход</div><div class="controls"><button id="restart" title="Новая партия">⟳</button><button id="zoom-out">−</button><button id="zoom-in">+</button><button id="reset">↺</button><button id="difficulty">🤖 Medium</button><button id="theme">◐</button><button id="sound">🔊</button></div><div class="toast" id="toast"></div><div class="modal" id="end"><div class="card"><h1 id="end-title">Победа!</h1><p id="end-copy"></p><button id="again">Ещё раз</button></div></div><script>

function resize(){let d=Math.min(devicePixelRatio||1,2);cvs.width=innerWidth*d;cvs.height=innerHeight*d;cvs._d=d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2400)}function tone(f=600){if(!sound)return;try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.stop(a.currentTime+.13)}catch{}}
function arcVector(x,y){let rad=Math.max(40,Math.sqrt(3)*.53*Math.max(innerWidth,innerHeight)*.9/Math.max(2,Math.max(innerWidth,innerHeight)*.9/(Math.sqrt(3)*.78))),nx=(x-innerWidth*.5)/rad,ny=-(y-innerHeight*.5)/rad,d=nx*nx+ny*ny;return [nx,ny,d<=.5?Math.sqrt(1-d):.5/Math.sqrt(d)]}
// Orthographic projection with depth-sorted glassy spheres.
function project(){let w=innerWidth,h=innerHeight,mobile=w<=700,left=mobile?104:218,right=mobile?14:180,top=mobile?120:126,bottom=mobile?h-185:h-95,cx=left+(w-left-right)/2,cy=(top+bottom)/2,half=Math.min(w-left-right,bottom-top)/2;let f=Math.max(w,h)*.90,SP=.689,R=.325,bound=Math.sqrt(3)*(SP+R),available=Math.max(48,half-12)*1.3,d=Math.max(bound*Math.sqrt(1+(f/available)**2),(1.95+.105)*f/available+.56)/zoom;view3d={cx,cy,f,d,SP,R};projected=nodes.map(s=>{let q=qrot(cubeQ,s.cell),pers=f/(d-q[2]);return{s,x:cx+q[0]*pers*SP,y:cy-q[1]*pers*SP,r:pers*R,z:q[2]}}).sort((a,b)=>a.z-b.z)}function sphere(p){let{s,x,y,r}=p,col=s.owner==='player'?'#258fdf':s.owner==='ai'?'#ed6465':'#35b982';let g=ctx.createRadialGradient(x-r*.38,y-r*.48,r*.06,x+r*.08,y+r*.12,r*1.14);g.addColorStop(0,'#ffffff');g.addColorStop(.22,col);g.addColorStop(.78,col);g.addColorStop(1,'#153147');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.5;ctx.stroke();ctx.beginPath();ctx.ellipse(x-r*.32,y-r*.48,r*.23,r*.12,-.55,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.65)';ctx.fill();if(s.pulse>0){ctx.strokeStyle=s.pulseColor;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r*(1.18+(0.6-s.pulse)*.22),0,Math.PI*2);ctx.stroke();s.pulse=Math.max(0,s.pulse-.018)}if(selected===s.id){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r*1.22,0,Math.PI*2);ctx.stroke()}}

ctx.save();ctx.strokeStyle=document.body.classList.contains('dark')?'rgba(135,199,229,.88)':'rgba(55,119,157,.88)';ctx.lineWidth=Math.max(4,Math.min(7,innerWidth*.009));ctx.lineJoin='round';ctx.lineCap='round';let edge=1.55;function edgePoint(v){let q=qrot(cubeQ,v),k=view3d.f/(view3d.d-q[2]);return{x:view3d.cx+q[0]*k*view3d.SP,y:view3d.cy-q[1]*k*view3d.SP}}for(let axis=0;axis<3;axis++)for(let a of [-1,1])for(let b of [-1,1]){let v1=[0,0,0],v2=[0,0,0],uv=[0,1,2].filter(k=>k!==axis);v1[axis]=-edge;v2[axis]=edge;v1[uv[0]]=v2[uv[0]]=a*edge;v1[uv[1]]=v2[uv[1]]=b*edge;let n1=[0,0,0],n2=[0,0,0];n1[uv[0]]=a;n2[uv[1]]=b;if(qrot(cubeQ,n1)[2]<.025&&qrot(cubeQ,n2)[2]<.025)continue;let p1=edgePoint(v1),p2=edgePoint(v2);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}ctx.restore();if(selected!==null){let A=map.get(selected);for(const j of targets){let B=map.get(j.over),C=map.get(j.to);if(!A||!C)continue;ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle='#258fdfbb';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.lineTo(C.x,C.y);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#258fdf';ctx.lineWidth=3;ctx.beginPath();ctx.arc(C.x,C.y,C.r*1.2,0,Math.PI*2);ctx.stroke();ctx.restore()}}if(phase==='bonus-select')for(const p of projected)if(p.s.owner==='ai'){ctx.strokeStyle='#ffb';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r*1.23,0,Math.PI*2);ctx.stroke()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
function neighbors(id){let c=nodes[id].cell;return dirs.map(d=>{let n=byCell.get(key(c.map((v,i)=>v+d[i])));return n?n.id:null})}function validJumps(owner){let out=[];for(let s of nodes)if(s.owner===owner)for(let d of dirs){let b=byCell.get(key(s.cell.map((v,i)=>v+d[i]))),c=byCell.get(key(s.cell.map((v,i)=>v+2*d[i])));if(b&&c&&!(b.owner===owner&&c.owner===owner))out.push({from:s.id,over:b.id,to:c.id,dir:d})}return out}function setOwner(s,o){s.owner=o;s.pulse=.6;s.pulseColor=o==='player'?'#258fdf':o==='ai'?'#ed6465':'#35b982';tone(o==='player'?660:440)}function line3(id,owner){let c=nodes[id].cell;for(let a=0;a<3;a++){let line=[-1,0,1].map(v=>{let p=c.slice();p[a]=v;return byCell.get(key(p))});if(line.every(n=>n&&n.owner===owner))return true}return false}function faceDone(o){for(let f=0;f<6;f++)if(!fullFaces[o].has(f)&&nodes.filter(n=>n.incident.includes(f)).every(n=>n.owner===o)){fullFaces[o].add(f);return true}return false}function surround(o){let opp=o==='player'?'ai':'player',changed=[];for(let n of nodes)if(n.owner===opp&&neighbors(n.id).every(id=>id===null||nodes[id].owner===o)){setOwner(n,o);changed.push(n)}return changed}function updateHud(){score.player=nodes.filter(n=>n.owner==='player').length;score.ai=nodes.filter(n=>n.owner==='ai').length;document.querySelector('#score-blue').textContent=score.player;document.querySelector('#score-red').textContent=score.ai;document.querySelector('#moves-count').textContent=`Ходов: ${moveCount}`;document.querySelector('#turn-label').textContent=phase==='ai-thinking'?'ИИ думает…':turn==='player'?'Твой ход':'Ход ИИ';document.querySelector('#uma-status').textContent=phase==='ai-thinking'?'УМА · ИИ думает…':phase==='bonus-select'?'УМА · Выбери шарик':'УМА · '+(turn==='player'?'Твой ход':'Ход ИИ')}
function won(){let p=score.player,a=score.ai;if(p>=14||nodes.some(n=>n.owner==='player'&&faces(n).length>0&&[0,1,2,3,4,5].some(f=>nodes.filter(x=>x.incident.includes(f)).every(x=>x.owner==='player'))))return'player';if(a>=14||[0,1,2,3,4,5].some(f=>nodes.filter(x=>x.incident.includes(f)).every(x=>x.owner==='ai')))return'ai';if(moveCount>=60)return'draw';return null}function endCheck(){updateHud();let w=won();if(w){phase=w==='draw'?'draw':'won';document.querySelector('#end-title').textContent=w==='player'?'Победа!':w==='ai'?'Поражение':'Ничья';document.querySelector('#end-copy').textContent=`Синий ${score.player} : ${score.ai} красный · ${moveCount} ходов`;document.querySelector('#end').classList.add('show');return true}return false}function doJump(j,o,bonus=false){let B=nodes[j.over],C=nodes[j.to];if(B.owner!==o)setOwner(B,o);if(C.owner!==o)setOwner(C,o);moveCount++;let combo=line3(C.id,o),face=faceDone(o);let casc=0;while(casc<2){let got=surround(o);if(!got.length)break;casc++}if(casc)toast('Окружён!');if(endCheck())return;if(face){toast('ГРАНЬ ЗАХВАЧЕНА! Выбери вражеский шарик');if(o==='player'){phase='bonus-select';bonusFace=true;turn=o;updateHud();return}else{let victim=nodes.filter(n=>n.owner==='player').sort((a,b)=>neighbors(a.id).filter(x=>x!==null&&nodes[x].owner==='ai').length-neighbors(b.id).filter(x=>x!==null&&nodes[x].owner==='ai').length).pop();if(victim)setOwner(victim,'ai');if(endCheck())return}}if(combo&&!bonus){let opts=validJumps(o).filter(x=>x.from===C.id);if(opts.length){toast('КОМБО! Линия из 3 — бонусный прыжок');if(o==='player'){selected=C.id;targets=opts;comboAvailable=true;turn=o;phase='play';updateHud();return}else {setTimeout(()=>aiMove(true),480);return}}}if(endCheck())return;if(o==='player'){selected=null;targets=[];turn='ai';phase='ai-thinking';updateHud();setTimeout(aiMove,350)}else{turn='player';phase='play';selected=null;targets=[];updateHud();if(!validJumps('player').length){turn='ai';toast('Нет ходов — пропуск');setTimeout(aiMove,35 function tap(id){if(phase==='bonus-select'){if(nodes[id].owner==='ai'){setOwner(nodes[id],'player');bonusFace=false;phase='play';selected=null;endCheck();turn='ai';phase='ai-thinking';updateHud();setTimeout(aiMove,350)}return}if(phase!=='play'||turn!=='player')return;if(selected!==null){let j=targets.find(x=>x.to===id);if(j){let was=comboAvailable;comboAvailable=false;selected=null;targets=[];doJump(j,'player',was);return}if(comboAvailable){comboAvailable=false;selected=null;targets=[];turn='ai';phase='ai-thinking';toast('Бонус пропущен');updateHud();setTimeout(aiMove,350);return}}if(nodes[id].owner==='player'){selected=id;targets=validJumps('player').filter(j=>j.from===id);if(!targets.length)toast('Отсюда нет прыжка');}else{selected=null;targets=[];if(first)toast('Сначала тапни свой синий шарик');else toast('Выбери подсвеченную цель')}updateHud()}
function evaluate(owner){let s=nodes.filter(n=>n.owner===owner).length*10;for(let axis=0;axis<3;axis++)for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){let arr=[-1,0,1].map(v=>{let c=[a,b,v];c[axis]=v;return byCell.get(key(c))});if(arr.every(Boolean)){let own=arr.filter(n=>n.owner===owner).length;if(own===3)s+=50;else if(own===2)s+=15}}for(let f=0;f<6;f++){let q=nodes.filter(n=>n.incident.includes(f)).filter(n=>n.owner===owner).length;s+=q===9?300:q===8?40:q===7?10:0}return s}function aiChoice(){let m=validJumps('ai');if(!m.length)return null;let scored=m.map(j=>{let gain=(nodes[j.over].owner!=='ai'?1:0)+(nodes[j.to].owner!=='ai'?1:0);let old=[nodes[j.over].owner,nodes[j.to].owner];nodes[j.over].owner=nodes[j.to].owner='ai';let v=evaluate('ai')-evaluate('player')*1.1;nodes[j.over].owner=old[0];nodes[j.to].owner=old[1];return{j,score:aiLevel===1?gain*20+Math.random()*25:v}}).sort((a,b)=>b.score-a.score);return aiLevel===1?scored[Math.floor(Math.random()*Math.min(3,scored.length))].j:scored[0].j}function aiMove(bonus=false){if(phase==='won'||phase==='draw')return;phase='ai-thinking';turn='ai';updateHud();let j=aiChoice();if(!j){turn='player';phase='play';toast('ИИ пропускает ход');updateHud();return}doJump(j,'ai',bonus)}
function newGame(){for(let n of nodes){n.owner='neutral';n.pulse=0}nodes[0].owner='player';nodes[25].owner='ai';score={player:1,ai:1};moveCount=0;fullFaces={player:new Set,ai:new Set};selected=null;targets=[];comboAvailable=false;phase='play';turn='player';first=true;document.querySelector('#end').classList.remove('show');updateHud();toast('Тапни синий шарик, затем цель через один. Собери 14.')}newGame();function hit(x,y){let best=null,dist=Infinity;for(let p of projected){let d=Math.hypot(x-p.x,y-p.y);if(d<p.r*1.3&&d<dist){best=p.s.id;dist=d}}return best}
cvs.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,lastMove:performance.now(),arc:arcVector(e.clientX,e.clientY),moved:false};cvs.setPointerCapture(e.pointerId)});cvs.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(drag.moved){let v=arcVector(e.clientX,e.clientY),dq=qbetween(drag.arc,v);if(Number.isFinite(dq[3]))cubeQ=qnorm(qmul(dq,cubeQ));drag.arc=v;drag.x=e.clientX;drag.y=e.clientY;drag.lastMove=performance.now()}});cvs.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){let id=hit(e.clientX,e.clientY);if(id!==null){first=false;tap(id)}}drag=null});cvs.addEventListener('wheel',e=>{zoom=Math.max(.55,Math.min(1.6,zoom*(e.deltaY<0?1.08:.92)))},{passive:true});document.querySelector('#restart').onclick=newGame;document.querySelector('#again').onclick=newGame;document.querySelector('#zoom-in').onclick=()=>zoom=Math.min(1.6,zoom*1.12);document.querySelector('#zoom-out').onclick=()=>zoom=Math.max(.55,zoom/1.12);document.querySelector('#reset').onclick=()=>{cubeQ=[0,0,0,1];zoom=1};document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');document.querySelector('#sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊':'🔇'};document.querySelector('#difficulty').onclick=e=>{aiLevel=aiLevel%3+1;e.currentTarget.textContent='🤖 '+['','Easy','Medium','Hard'][aiLevel]};document.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')newGame();if(e.key==='ArrowLeft')cubeQ=qnorm(qmul([0,Math.sin(-.06),0,Math.cos(.06)],cubeQ));if(e.key==='ArrowRight')cubeQ=qnorm(qmul([0,Math.sin(.06),0,Math.cos(.06)],cubeQ));if(e.key==='ArrowUp')cubeQ=qnorm(qmul([Math.sin(-.06),0,0,Math.cos(.06)],cubeQ));if(e.key==='ArrowDown')cubeQ=qnorm(qmul([Math.sin(.06),0,0,Math.cos(.06)],cubeQ))});
